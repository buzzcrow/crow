[workspace]
name = "crowkv"
version = "0.1.0"
description = "CrowKV — distributed key-value store with multi-paxos groups"
channels = ["conda-forge"]
# Keep glibc requirement low (2.17 = CentOS 7 / Ubuntu 16.04 era) so that
# Linux binaries built in this environment run on older distributions.
# conda-forge packages are built against glibc 2.17 by default.
platforms = [
  "osx-arm64",
  "linux-64",
]

[dependencies]
# C++ build toolchain (crowtree)
cmake = ">=3.20"
make = "*"
cxx-compiler = "*"
gtest = "*"
lz4 = "*"
libabseil = "*"  # crowtree MemTable uses absl::btree_map (plan-tree #9)
spdlog = ">=1.17.0,<2"  # crowtree async file logging (plan-tree #10)
clang-format = ">=19.0.0"
clang-tools = "*"
folly = "*"
# Rust toolchain (crowkv)
rust = ">=1.96"
protobuf = "*"
openssl = "*"
pkg-config = "*"
# Frontend
nodejs = ">=22,<23"
# Tools
git = "*"
tokei = "*"
benchmark = ">=1.9.5,<2"
zlib = ">=1.3.2,<2"
xz = ">=5.8.3,<6"
zstd = ">=1.5.7,<2"
bzip2 = ">=1.0.8,<2"
snappy = ">=1.2.2,<2"

# io_uring reactor (crowtree/include/crowtree/reactor.h).
# Linux-only kernel interface -- no osx-arm64 conda-forge build exists, so this
# must be a per-platform target dependency, not a top-level one (design doc
# design-crowtree-engine.md §3.5: the reactor itself is excluded from macOS
# builds; see crowtree/CMakeLists.txt's CROWTREE_HAVE_LIBURING gate).
[target.linux-64.dependencies]
liburing = "*"

[tasks]

# ── Build ────────────────────────────────────────────────────────
install-deps = '''
bash -c '
set -e
git config core.hooksPath .githooks
test -d crowkv-console/web/ui/node_modules || (cd crowkv-console/web/ui && npm ci)
cargo install cargo-tarpaulin || echo "Warning: cargo-tarpaulin install failed (expected on macOS)"
'
'''
ct-fmt = '''
find crowtree/src crowtree/include crowtree/tests crowtree/bench -type f \( -name '*.cpp' -o -name '*.h' \) -print0 | xargs -0 clang-format -i
'''
ct-lint = "python3 tools/ct_lint.py"
rs-fmt = "cargo fmt --all"
rs-lint = "cargo clippy --all-targets -- -D warnings"
ts-lint = { cmd = "cd crowkv-console/web/ui && npx tsc --noEmit --project tsconfig.e2e.json", depends-on = ["install-deps"] }
build = { cmd = "cmake -S crowtree -B crowtree/build -DCMAKE_BUILD_TYPE=Release && cmake --build crowtree/build -j && cargo build --release && cd crowkv-console/web/ui && npm run build", depends-on = ["install-deps"] }
default = { depends-on = ["build"] }

# ── Run ──────────────────────────────────────────────────────────
web = { cmd = "echo 'CrowKV console starting at: http://127.0.0.1:9920/' && cargo run --release -p crowkv-web", depends-on = ["build"] }

# ── Benchmark ────────────────────────────────────────────────────
bench = { cmd = "cargo run --release -p crowkv-cli -- bench run --mode mem --duration-secs 12 --threads 1 --connections 1 --workload write", depends-on = ["build"] }
bench-mem = { cmd = "cargo run --release -p crowkv-cli -- bench run --mode mem --duration-secs 30", depends-on = ["build"] }
bench-file = { cmd = "cargo run --release -p crowkv-cli -- bench run --mode file --duration-secs 30", depends-on = ["build"] }
bench-block = { cmd = "cargo run --release -p crowkv-cli -- bench run --mode block --duration-secs 30", depends-on = ["build"] }
bench-burst = { cmd = "cargo run --release -p crowkv-cli -- bench run --mode mem --duration-secs 10 --threads 64 --connections 8 --key-space 10000 --value-size 256 --workload mix", depends-on = ["build"] }
bench-soak = { cmd = "cargo run --release -p crowkv-cli -- bench run --mode mem --duration-secs 30 --threads 8 --connections 4 --key-space 100000 --value-size 1024 --workload write", depends-on = ["build"] }
bench-hotread = { cmd = "cargo run --release -p crowkv-cli -- bench run --mode mem --duration-secs 15 --threads 32 --connections 4 --key-space 64 --value-size 64 --workload read", depends-on = ["build"] }
bench-compare = { cmd = "cargo run --release -p crowkv-cli -- bench compare", depends-on = ["build"] }

# ── Test ─────────────────────────────────────────────────────────
clean-env = "pkill -9 -f 'crowkv-server.*test-logs' 2>/dev/null; rm -rf test-logs; true"
test-ct = { cmd = "ctest --test-dir crowtree/build --output-on-failure", depends-on = ["build"] }
test-ffi = { cmd = "cargo test -p crowtree-ffi --all-targets", depends-on = ["build"] }
test-core = { cmd = "cargo test -p crowkv --all-targets", depends-on = ["build"] }
test-server = { cmd = "cargo test -p crowkv-server --all-targets", depends-on = ["build"] }
test-cli = { cmd = "cargo test -p crowkv-cli --all-targets", depends-on = ["build"] }
test-mgmt-api = { cmd = "cargo test -p crowkv-web --all-targets", depends-on = ["build"] }
test-ui = { cmd = "cargo build -p crowkv-server && export CROWKV_SERVER_BINARY=$(pwd)/target/debug/crowkv-server && cd crowkv-console/web/ui && npm test && npx playwright test --config=e2e/realBackend.config.ts", depends-on = ["install-deps"] }
test = { cmd = '''
bash -c '
pixi run test-ct & p1=$!
pixi run test-ffi & p2=$!
pixi run test-core & p3=$!
pixi run test-server & p4=$!
pixi run test-cli & p5=$!
pixi run test-mgmt-api & p6=$!
pixi run test-ui & p7=$!
wait $p1 && wait $p2 && wait $p3 && wait $p4 && wait $p5 && wait $p6 && wait $p7
'
''', depends-on = ["build", "install-deps"] }
test-suite = { cmd = '''
bash -c '
set -e
pixi run clean-env
pixi run test-ct
pixi run clean-env
pixi run test-ffi
pixi run clean-env
pixi run test-core
pixi run clean-env
pixi run test-server
pixi run clean-env
pixi run test-cli
pixi run clean-env
pixi run test-mgmt-api
pixi run clean-env
pixi run test-ui
'
''', depends-on = ["build", "install-deps"] }

# ── Coverage & LOC ───────────────────────────────────────────────
coverage = { cmd = "cargo tarpaulin --workspace --out Html --output-dir target/coverage --exclude-files '*/tests/*'", depends-on = ["install-deps"] }
loc = "tokei --exclude swagger-ui --exclude 'crowtree/build-*' --exclude target --exclude dist --exclude node_modules --exclude 'doc/user-manual/*.html' --exclude 'doc/user-manual/*.py'"

# ── Clean ────────────────────────────────────────────────────────
clean = { cmd = '''
bash -c '
pkill crowkv-server || true
pkill crowkv-web || true
pkill crowkv-cli || true
cargo clean
rm -rf crowtree/build crowtree/build-asan crowtree/build-tsan crowtree/build-ubsan
rm -rf crowkv-console/web/ui/dist crowkv-console/web/ui/node_modules
rm -rf test-logs
find . -type d -name log ! -path "*/src/*" -prune -exec rm -rf {} \; 2>/dev/null || true
find . -type d -name runtime-data ! -path "*/src/*" -prune -exec rm -rf {} \; 2>/dev/null || true
'
''' }

# ── crowtree sanitizers ──────────────────────────────────────────

# AddressSanitizer build + tests. setarch -R disables ASLR (Linux only);
# on macOS we run ctest directly.
ct-asan = '''
set -e
cmake -S crowtree -B crowtree/build-asan -DCMAKE_BUILD_TYPE=Debug -DCROWTREE_SANITIZER=address
cmake --build crowtree/build-asan -j
if command -v setarch > /dev/null 2>&1; then
  setarch -R ctest --test-dir crowtree/build-asan --output-on-failure
else
  ctest --test-dir crowtree/build-asan --output-on-failure
fi
'''

# ThreadSanitizer build + tests.
ct-tsan = '''
set -e
cmake -S crowtree -B crowtree/build-tsan -DCMAKE_BUILD_TYPE=Debug -DCROWTREE_SANITIZER=thread
cmake --build crowtree/build-tsan -j
if command -v setarch > /dev/null 2>&1; then
  setarch -R ctest --test-dir crowtree/build-tsan --output-on-failure
else
  ctest --test-dir crowtree/build-tsan --output-on-failure
fi
'''

# UndefinedBehaviorSanitizer build + tests.
ct-ubsan = '''
set -e
cmake -S crowtree -B crowtree/build-ubsan -DCMAKE_BUILD_TYPE=Debug -DCROWTREE_SANITIZER=undefined
cmake --build crowtree/build-ubsan -j
export UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1
if command -v setarch > /dev/null 2>&1; then
  setarch -R ctest --test-dir crowtree/build-ubsan --output-on-failure
else
  ctest --test-dir crowtree/build-ubsan --output-on-failure
fi
'''
