[workspace]
name = "crow-kv"
version = "0.1.0"
description = "CROW — distributed key-value store with multi-paxos groups"
channels = ["conda-forge"]
# Keep glibc requirement low (2.17 = CentOS 7 / Ubuntu 16.04 era) so that
# Linux binaries built in this environment run on older distributions.
# conda-forge packages are built against glibc 2.17 by default.
platforms = [
  "osx-arm64",
  "linux-64",
]

[dependencies]
# C++ build toolchain (lib/crow-tree)
cmake = ">=3.20"
make = "*"
cxx-compiler = "*"
gtest = "*"
lz4 = "*"
libabseil = "*"  # lib/crow-tree MemTable uses absl::btree_map (plan-tree #9)
spdlog = ">=1.17.0,<2"  # lib/crow-tree async file logging (plan-tree #10)
clang-format = ">=19.0.0"
clang-tools = "*"
folly = "*"
isa-l = "*"
# Rust toolchain (crow-kv)
rust = ">=1.96"
protobuf = "*"
openssl = "*"
pkg-config = "*"
# Frontend
nodejs = ">=22,<23"
# Tools
git = "*"
tokei = "*"
benchmark = ">=1.9.5,<2"
zlib = ">=1.3.2,<2"
xz = ">=5.8.3,<6"
zstd = ">=1.5.7,<2"
bzip2 = ">=1.0.8,<2"
snappy = ">=1.2.2,<2"

# io_uring reactor (lib/crow-tree/include/lib/crow-tree/reactor.h).
# Linux-only kernel interface -- no osx-arm64 conda-forge build exists, so this
# must be a per-platform target dependency, not a top-level one (design doc
# design/tree/design-crow-tree-engine.md §3.5: the reactor itself is excluded from macOS
# builds; see lib/crow-tree/CMakeLists.txt's CROW_TREE_HAVE_LIBURING gate).
[target.linux-64.dependencies]
liburing = "*"

[tasks]

# ── Build ────────────────────────────────────────────────────────
install-deps = '''
bash -c '
set -e
git config core.hooksPath .githooks
test -d app/crow-web/ui/node_modules || (cd app/crow-web/ui && npm ci)
cargo install cargo-tarpaulin || echo "Warning: cargo-tarpaulin install failed (expected on macOS)"
cargo install --locked samply || echo "Warning: samply install failed"
cargo install --locked inferno || echo "Warning: inferno install failed"
'
'''
tree-fmt = '''
find lib/crow-tree/src lib/crow-tree/include lib/crow-tree/tests lib/crow-tree/bench lib/crow-common/cpp -type f \( -name '*.cpp' -o -name '*.h' \) -print0 | xargs -0 clang-format -i
'''
tree-lint = "python3 tools/ct_lint.py"
rs-fmt = "cargo fmt --all"
rs-lint = "cargo clippy --all-targets -- -D warnings"
ts-lint = { cmd = "cd app/crow-web/ui && npx tsc --noEmit --project tsconfig.e2e.json", depends-on = ["install-deps"] }
build = { cmd = "cmake -S lib/crow-tree -B lib/crow-tree/build -DCMAKE_BUILD_TYPE=Release && cmake --build lib/crow-tree/build -j && cargo build --release && cd app/crow-web/ui && npm run build", depends-on = ["install-deps"] }
default = { depends-on = ["build"] }

# ── Run ──────────────────────────────────────────────────────────
web = { cmd = "echo 'CROW console starting at: http://127.0.0.1:9920/' && cargo run --release -p crow-web", depends-on = ["build"] }

# ── Benchmark ────────────────────────────────────────────────────
bench = { cmd = "cargo run --release -p crow-cli -- bench run --mode mem --duration-secs 12 --threads 2 --connections 1 --workload write", depends-on = ["build"] }
bench-mem = { cmd = "cargo run --release -p crow-cli -- bench run --mode mem --duration-secs 30", depends-on = ["build"] }
bench-file = { cmd = "cargo run --release -p crow-cli -- bench run --mode file --duration-secs 30", depends-on = ["build"] }
bench-block = { cmd = "cargo run --release -p crow-cli -- bench run --mode block --duration-secs 30", depends-on = ["build"] }
bench-burst = { cmd = "cargo run --release -p crow-cli -- bench run --mode mem --duration-secs 10 --threads 64 --connections 8 --key-space 10000 --value-size 256 --workload mix", depends-on = ["build"] }
bench-soak = { cmd = "cargo run --release -p crow-cli -- bench run --mode mem --duration-secs 30 --threads 8 --connections 4 --key-space 100000 --value-size 1024 --workload write", depends-on = ["build"] }
bench-hotread = { cmd = "cargo run --release -p crow-cli -- bench run --mode mem --duration-secs 15 --threads 32 --connections 4 --key-space 64 --value-size 64 --workload read", depends-on = ["build"] }
bench-compare = { cmd = "cargo run --release -p crow-cli -- bench compare", depends-on = ["build"] }

# ── Profile ───────────────────────────────────────────────────────
profile-write = { cmd = "bash tools/profile-write.sh", depends-on = ["build"] }

# ── Test ─────────────────────────────────────────────────────────
clean-env = "pkill -9 -f 'crow-kv-server.*test-logs' 2>/dev/null; rm -rf test-logs; true"
test-tree-ct = { cmd = "ctest --test-dir lib/crow-tree/build --output-on-failure", depends-on = ["build"] }
test-tree-ffi = { cmd = "cargo test -p crow-tree-ffi --all-targets", depends-on = ["build"] }
test-kv-core = { cmd = "cargo test -p crow-kv --all-targets", depends-on = ["build"] }
test-kv-server = { cmd = "cargo test -p crow-kv-server --all-targets -- --test-threads=1", depends-on = ["build"] }
test-console-cli = { cmd = "cargo test -p crow-cli --all-targets", depends-on = ["build"] }
test-console-server = { cmd = "cargo test -p crow-web --all-targets -- --test-threads=1", depends-on = ["build"] }
test-console-ui = { cmd = "cargo build -p crow-kv-server && export CROW_KV_SERVER_BINARY=$(pwd)/target/debug/crow-kv-server && cd app/crow-web/ui && npm test && npx playwright test --config=e2e/realBackend.config.ts", depends-on = ["install-deps"] }
test = { cmd = '''
bash -c '
pixi run test-tree-ct & p1=$!
pixi run test-tree-ffi & p2=$!
pixi run test-kv-core & p3=$!
pixi run test-kv-server & p4=$!
pixi run test-console-cli & p5=$!
pixi run test-console-server & p6=$!
pixi run test-console-ui & p7=$!
wait $p1 && wait $p2 && wait $p3 && wait $p4 && wait $p5 && wait $p6 && wait $p7
'
''', depends-on = ["build", "install-deps"] }
test-suite = { cmd = '''
bash -c '
set -e
pixi run clean-env
pixi run test-tree-ct
pixi run clean-env
pixi run test-tree-ffi
pixi run clean-env
pixi run test-kv-core
pixi run clean-env
pixi run test-kv-server
pixi run clean-env
pixi run test-console-cli
pixi run clean-env
pixi run test-console-server
pixi run clean-env
pixi run test-console-ui
'
''', depends-on = ["build", "install-deps"] }

# ── Coverage & LOC ───────────────────────────────────────────────
coverage = { cmd = "cargo tarpaulin --workspace --out Html --output-dir target/coverage --exclude-files '*/tests/*'", depends-on = ["install-deps"] }
loc = "tokei --exclude swagger-ui --exclude 'lib/crow-tree/build-*' --exclude target --exclude dist --exclude node_modules --exclude 'doc/user-manual/*.html' --exclude 'doc/user-manual/*.py'"

# ── Clean ────────────────────────────────────────────────────────
clean = { cmd = '''
bash -c '
pkill crow-kv-server || true
pkill crow-web || true
pkill crow-cli || true
cargo clean
rm -rf lib/crow-tree/build lib/crow-tree/build-asan lib/crow-tree/build-tsan lib/crow-tree/build-ubsan
rm -rf app/crow-web/ui/dist app/crow-web/ui/node_modules
rm -rf test-logs
find . -type d -name log ! -path "*/src/*" -prune -exec rm -rf {} \; 2>/dev/null || true
find . -type d -name runtime-data ! -path "*/src/*" -prune -exec rm -rf {} \; 2>/dev/null || true
'
''' }

# ── lib/crow-tree sanitizers ──────────────────────────────────────────

# AddressSanitizer build + tests. setarch -R disables ASLR (Linux only);
# on macOS we run ctest directly.
tree-asan = '''
set -e
cmake -S lib/crow-tree -B lib/crow-tree/build-asan -DCMAKE_BUILD_TYPE=Debug -DCROW_TREE_SANITIZER=address
cmake --build lib/crow-tree/build-asan -j
if command -v setarch > /dev/null 2>&1; then
  setarch -R ctest --test-dir lib/crow-tree/build-asan --output-on-failure
else
  ctest --test-dir lib/crow-tree/build-asan --output-on-failure
fi
'''

# ThreadSanitizer build + tests.
tree-tsan = '''
set -e
cmake -S lib/crow-tree -B lib/crow-tree/build-tsan -DCMAKE_BUILD_TYPE=Debug -DCROW_TREE_SANITIZER=thread
cmake --build lib/crow-tree/build-tsan -j
if command -v setarch > /dev/null 2>&1; then
  setarch -R ctest --test-dir lib/crow-tree/build-tsan --output-on-failure
else
  ctest --test-dir lib/crow-tree/build-tsan --output-on-failure
fi
'''

# UndefinedBehaviorSanitizer build + tests.
tree-ubsan = '''
set -e
cmake -S lib/crow-tree -B lib/crow-tree/build-ubsan -DCMAKE_BUILD_TYPE=Debug -DCROW_TREE_SANITIZER=undefined
cmake --build lib/crow-tree/build-ubsan -j
export UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1
if command -v setarch > /dev/null 2>&1; then
  setarch -R ctest --test-dir lib/crow-tree/build-ubsan --output-on-failure
else
  ctest --test-dir lib/crow-tree/build-ubsan --output-on-failure
fi
'''
