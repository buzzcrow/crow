[workspace]
name = "crow-kv"
version = "0.1.0"
description = "CROW — distributed key-value store with multi-paxos groups"
channels = ["conda-forge"]
# Keep glibc requirement low (2.17 = CentOS 7 / Ubuntu 16.04 era) so that
# Linux binaries built in this environment run on older distributions.
# conda-forge packages are built against glibc 2.17 by default.
platforms = [
  "osx-arm64",
  "linux-64",
]

[dependencies]
# C++ build toolchain (lib/crow-tree)
cmake = ">=3.20"
make = "*"
cxx-compiler = "*"
gtest = "*"
lz4 = "*"
libabseil = "*"  # lib/crow-tree MemTable uses absl::btree_map (plan-tree #9)
spdlog = ">=1.17.0,<2"  # lib/crow-tree async file logging (plan-tree #10)
clang-format = ">=19.0.0"
clang-tools = "*"
folly = "*"
isa-l = "*"
# Flatbuffer schema compiler + runtime headers for crow-rpc (R104) and
# crow-protocol's .fbs codegen. Provides `flatc` and flatbuffers/cpp headers.
flatbuffers = "*"
# Rust toolchain (crow-kv)
rust = ">=1.96"
protobuf = "*"
openssl = "*"
pkg-config = "*"
# Frontend
nodejs = ">=22,<23"
# Tools
git = "*"
tokei = "*"
benchmark = ">=1.9.5,<2"
zlib = ">=1.3.2,<2"
xz = ">=5.8.3,<6"
zstd = ">=1.5.7,<2"
bzip2 = ">=1.0.8,<2"
snappy = ">=1.2.2,<2"

# io_uring reactor (lib/crow-tree/include/lib/crow-tree/reactor.h).
# Linux-only kernel interface -- no osx-arm64 conda-forge build exists, so this
# must be a per-platform target dependency, not a top-level one (design doc
# design/tree/design-crow-tree-engine.md §3.5: the reactor itself is excluded from macOS
# builds; see lib/crow-tree/CMakeLists.txt's CROW_TREE_HAVE_LIBURING gate).
[target.linux-64.dependencies]
liburing = "*"
# RDMA transport for crow-rpc (R104 Phase 5), gated behind
# CROW_RPC_HAVE_RDMA in lib/crow-rpc/CMakeLists.txt. No macOS RNICs, so
# these stay Linux-only (mirrors the liburing per-platform pattern).
# rdma-core provides both libibverbs and librdmacm.
rdma-core = "*"

[tasks]

# ── Build ────────────────────────────────────────────────────────
install-deps = '''
bash -c '
set -e
git config core.hooksPath .githooks
test -d app/crow-web/ui/node_modules || (cd app/crow-web/ui && npm ci)
cargo install cargo-tarpaulin || echo "Warning: cargo-tarpaulin install failed (expected on macOS)"
cargo install --locked samply || echo "Warning: samply install failed"
cargo install --locked inferno || echo "Warning: inferno install failed"
'
'''
tree-fmt = '''
find lib/crow-tree/src lib/crow-tree/include lib/crow-tree/tests lib/crow-tree/bench lib/crow-common/cpp lib/crow-rpc/src lib/crow-rpc/include lib/crow-rpc/tests -type f \( -name '*.cpp' -o -name '*.h' \) -print0 | xargs -0 clang-format -i
'''
tree-lint = "python3 tools/ct_lint.py"
rs-fmt = "cargo fmt --all"
rs-lint = "cargo clippy --all-targets -- -D warnings"
ts-lint = { cmd = "cd app/crow-web/ui && npx tsc --noEmit --project tsconfig.e2e.json", depends-on = ["install-deps"] }
build = { cmd = "cmake -S lib/crow-tree -B lib/crow-tree/build -DCMAKE_BUILD_TYPE=Release && cmake --build lib/crow-tree/build -j && cmake -S lib/crow-rpc -B lib/crow-rpc/build -DCMAKE_BUILD_TYPE=Release && cmake --build lib/crow-rpc/build -j && cmake -S app/crow-diskio -B app/crow-diskio/build -DCMAKE_BUILD_TYPE=Release && cmake --build app/crow-diskio/build -j && cargo build --release && cd app/crow-web/ui && npm run build", depends-on = ["install-deps"] }
default = { depends-on = ["build"] }

# ── Run ──────────────────────────────────────────────────────────
web = { cmd = "echo 'CROW console starting at: http://127.0.0.1:9920/' && cargo run --release -p crow-web", depends-on = ["build"] }

# ── Benchmark ────────────────────────────────────────────────────
bench = { cmd = "cargo run --release -p crow-cli -- bench kv --mode mem --duration-secs 12 --loader-num 2 --connections 1 --workload write", depends-on = ["build"] }
bench-mem = { cmd = "cargo run --release -p crow-cli -- bench kv --mode mem --duration-secs 30", depends-on = ["build"] }
bench-file = { cmd = "cargo run --release -p crow-cli -- bench kv --mode file --duration-secs 30", depends-on = ["build"] }
bench-block = { cmd = "cargo run --release -p crow-cli -- bench kv --mode block --duration-secs 30", depends-on = ["build"] }
bench-burst = { cmd = "cargo run --release -p crow-cli -- bench kv --mode mem --duration-secs 10 --loader-num 64 --connections 8 --key-space 10000 --value-size 256 --workload mix", depends-on = ["build"] }
bench-soak = { cmd = "cargo run --release -p crow-cli -- bench kv --mode mem --duration-secs 30 --loader-num 8 --connections 4 --key-space 100000 --value-size 1024 --workload write", depends-on = ["build"] }
bench-hotread = { cmd = "cargo run --release -p crow-cli -- bench kv --mode mem --duration-secs 15 --loader-num 32 --connections 4 --key-space 64 --value-size 64 --workload read", depends-on = ["build"] }
bench-compare = { cmd = "cargo run --release -p crow-cli -- bench compare", depends-on = ["build"] }

# ── Profile ───────────────────────────────────────────────────────
profile-write = { cmd = "bash tools/profile-write.sh", depends-on = ["build"] }

# ── Test ─────────────────────────────────────────────────────────
clean-env = "pkill -9 -f 'crow-kv-server.*test-logs' 2>/dev/null; rm -rf test-logs; true"
test-tree-ct = { cmd = "ctest --test-dir lib/crow-tree/build --output-on-failure", depends-on = ["build"] }
test-common-ct = { cmd = "lib/crow-tree/build/crow-common-build/crowcommon_tests", depends-on = ["build"] }
test-rpc-ct = { cmd = "ctest --test-dir lib/crow-rpc/build --output-on-failure", depends-on = ["build"] }
test-diskio-ct = { cmd = "ctest --test-dir app/crow-diskio/build --output-on-failure", depends-on = ["build"] }
test-rpc-ffi = { cmd = "cargo test -p crow-rpc-ffi --all-targets", depends-on = ["build"] }
test-tree-ffi = { cmd = "cargo test -p crow-tree-ffi --all-targets", depends-on = ["build"] }
test-common = { cmd = "cargo test -p crow-common --all-targets", depends-on = ["build"] }
test-protocol = { cmd = "cargo test -p crow-protocol --all-targets", depends-on = ["build"] }
test-kv-core = { cmd = "cargo test -p crow-kv --all-targets", depends-on = ["build"] }
test-kv-client = { cmd = "cargo test -p crow-kv-client --all-targets", depends-on = ["build"] }
test-kv-server = { cmd = "cargo test -p crow-kv-server --all-targets", depends-on = ["build"] }
test-diskdb = { cmd = "cargo test -p crow-diskdb --all-targets", depends-on = ["build"] }
test-diskdb-client = { cmd = "cargo test -p crow-diskdb-client --all-targets", depends-on = ["build"] }
test-chunkdb = { cmd = "cargo test -p crow-chunkdb --all-targets", depends-on = ["build"] }
test-chunkdb-client = { cmd = "cargo test -p crow-chunkdb-client --all-targets", depends-on = ["build"] }
test-console-shared = { cmd = "cargo build -p crow-kv-server && cargo test -p crow-console-shared --all-targets", depends-on = ["build"] }
test-console-cli = { cmd = "cargo test -p crow-cli --all-targets", depends-on = ["build"] }
test-console-server = { cmd = "cargo test -p crow-web --all-targets", depends-on = ["build"] }
test-console-ui = { cmd = "cargo build -p crow-kv-server -p crow-diskdb && export CROW_KV_SERVER_BINARY=$(pwd)/target/debug/crow-kv-server && cd app/crow-web/ui && npm test && npx playwright test --config=e2e/realBackend.config.ts", depends-on = ["install-deps"] }
# Full workspace test suite, grouped by domain. clean-env only runs at start
# and before the console block (server-spawning tests with the heaviest
# process/log footprint); non-spawning and self-cleaning tests run back-to-back.
test-suite = { cmd = '''
bash -c '
set -e
pixi run clean-env
pixi run test-tree-ct
pixi run test-tree-ffi
pixi run test-rpc-ct
pixi run test-rpc-ffi
pixi run test-common
pixi run test-protocol
pixi run test-kv-core
pixi run test-kv-client
pixi run test-diskdb-client
pixi run test-chunkdb-client
pixi run test-kv-server
pixi run test-diskdb
pixi run test-chunkdb
pixi run clean-env
pixi run test-console-shared
pixi run test-console-cli
pixi run test-console-server
pixi run clean-env
pixi run test-console-ui
'
''', depends-on = ["build", "install-deps"] }

# ── Coverage & LOC ───────────────────────────────────────────────
coverage = { cmd = "cargo tarpaulin --workspace --out Html --output-dir target/coverage --exclude-files '*/tests/*'", depends-on = ["install-deps"] }
loc = "tokei --exclude swagger-ui --exclude 'lib/crow-tree/build-*' --exclude target --exclude dist --exclude node_modules --exclude 'doc/user-manual/*.html' --exclude 'doc/user-manual/*.py'"

# ── Clean ────────────────────────────────────────────────────────
# Removes all build/test/runtime artifacts, keeping only git-tracked
# files, the pixi env (.pixi/), and install-deps caches (node_modules).
# System-temp dirs (crow-web-*, crow-cli-test-* from std::env::temp_dir)
# live outside the repo and are not touched.
clean = { cmd = '''
bash -c '
set -e
pkill crow-kv-server || true
pkill crow-web || true
pkill crow-cli || true

# ── Rust build artifacts ──
echo "[clean] cargo clean"
cargo clean
echo "[clean] tarpaulin report"
rm -f tarpaulin-report.html

# ── C++ (crow-tree) build artifacts ──
echo "[clean] crow-tree build dirs"
rm -rf lib/crow-tree/build lib/crow-tree/build-*
rm -rf lib/crow-tree/Testing lib/crow-tree/.cache

# ── Frontend build artifacts (keep node_modules) ──
echo "[clean] frontend build artifacts"
rm -rf app/crow-web/ui/dist app/crow-web/ui/.vite app/crow-web/ui/test-results
rm -f app/crow-web/ui/*.tsbuildinfo

# ── Test runtime data (in-repo) ──
echo "[clean] test runtime data"
rm -rf test-logs runtime-data .test-tmp lib/crow-tree/.test-tmp
rm -rf app/crow-web/ui/e2e/runtime-data
rm -rf app/crow-cli/bench-runs

# `log/` is dangerous as a glob (common Rust module name) — explicit per crate.
# Repo-root `log/` is where crow-kv-server writes (CWD-relative); the per-crate
# paths are future-proofing (those bins currently log under runtime-data/).
echo "[clean] log dirs"
rm -rf log app/crow-kv-server/log app/crow-diskdb/log app/crow-cli/log lib/crow-console-shared/log app/crow-web/log

# ── Profiling artifacts ──
echo "[clean] profiling artifacts"
rm -rf doc/working/profile-*
rm -f doc/working/bench-*.tsv
rm -f perf.data* perf-script.txt flamegraph.svg

# ── find-based cleanup (run last, after rm steps shrink the tree) ──
# Prune heavy non-source subtrees (.pixi, node_modules, target, .git) so find
# only walks the source tree instead of 60k+ vendored/compiled entries.
echo "[clean] mutants.out"
find . \( -name .pixi -o -name node_modules -o -name target -o -name .git \) -prune \
  -o -type d -name mutants.out -print -exec rm -rf {} \; 2>/dev/null || true

# Per-crate runtime dirs — globs are safe (names do not appear in src/).
# Exclude app/ — tracked config templates live in app/*/conf/ (e.g.
# app/crow-diskdb/conf/crow_diskdb_config.toml) and must not be deleted.
echo "[clean] waldata/ctdata/conf runtime dirs"
find . \( -name .pixi -o -name node_modules -o -name target -o -name .git \) -prune \
  -o -type d \( -name waldata -o -name ctdata -o -name conf \) ! -path "*/src/*" ! -path "./app/*" \
  -print -exec rm -rf {} \; 2>/dev/null || true

# ── OS junk ──
# Avoid -delete (implies -depth on BSD/macOS, breaks -prune → full traversal).
echo "[clean] .DS_Store"
find . \( -name .pixi -o -name node_modules -o -name target -o -name .git \) -prune \
  -o -name .DS_Store -print0 2>/dev/null | xargs -0 rm -f 2>/dev/null || true
echo "[clean] done"
'
''' }

# ── lib/crow-tree sanitizers ──────────────────────────────────────────

# AddressSanitizer build + tests. setarch -R disables ASLR (Linux only);
# on macOS we run ctest directly.
tree-asan = '''
set -e
cmake -S lib/crow-tree -B lib/crow-tree/build-asan -DCMAKE_BUILD_TYPE=Debug -DCROW_TREE_SANITIZER=address
cmake --build lib/crow-tree/build-asan -j
if command -v setarch > /dev/null 2>&1; then
  setarch -R ctest --test-dir lib/crow-tree/build-asan --output-on-failure
else
  ctest --test-dir lib/crow-tree/build-asan --output-on-failure
fi
'''

# ThreadSanitizer build + tests.
tree-tsan = '''
set -e
cmake -S lib/crow-tree -B lib/crow-tree/build-tsan -DCMAKE_BUILD_TYPE=Debug -DCROW_TREE_SANITIZER=thread
cmake --build lib/crow-tree/build-tsan -j
if command -v setarch > /dev/null 2>&1; then
  setarch -R ctest --test-dir lib/crow-tree/build-tsan --output-on-failure
else
  ctest --test-dir lib/crow-tree/build-tsan --output-on-failure
fi
'''

# UndefinedBehaviorSanitizer build + tests.
tree-ubsan = '''
set -e
cmake -S lib/crow-tree -B lib/crow-tree/build-ubsan -DCMAKE_BUILD_TYPE=Debug -DCROW_TREE_SANITIZER=undefined
cmake --build lib/crow-tree/build-ubsan -j
export UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1
if command -v setarch > /dev/null 2>&1; then
  setarch -R ctest --test-dir lib/crow-tree/build-ubsan --output-on-failure
else
  ctest --test-dir lib/crow-tree/build-ubsan --output-on-failure
fi
'''
