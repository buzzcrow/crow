[package]
name = "crowkv-console-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { workspace = true, features = ["rt", "macros", "time", "process", "io-util"] }
futures = "0.3"
tracing = { workspace = true }
dirs = "5"
# C6: gRPC KV client. We depend on `crowkv` for its already-built tonic
# proto types (`crowkv::rpc::*`). This pulls in more than we need at
# the moment, but avoids re-running tonic-build in this crate.
crowkv = { path = "../../crowkv" }
tonic = "0.12"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net"] }
axum = "0.7"
