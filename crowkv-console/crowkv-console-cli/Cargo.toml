[package]
name = "crowkv-console-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "crowkv"
path = "src/main.rs"

[dependencies]
crowkv-console-core = { path = "../crowkv-console-core" }
crowkv-console-ssh = { path = "../crowkv-console-ssh" }
crowkv-console-bench = { path = "../crowkv-console-bench" }
clap = { version = "4", features = ["derive", "env"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
serde = "1"
serde_json = "1"
