[package]
name = "crowkv-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "crowkv-cli"
path = "src/main.rs"

[dependencies]
crowkv-console-shared = { path = "../shared" }
crowkv-client = { path = "../../crowkv-client" }
clap = { version = "4", features = ["derive", "env"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
hdrhistogram = "7"
rand = "0.8"
tracing = { workspace = true }
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
thiserror = "1"

[dev-dependencies]
# A12: kv_cli integration test spawns a real crowkv-web in front of
# crowkv-server so the CLI can route through `--console`.
crowkv-web = { path = "../web" }
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
