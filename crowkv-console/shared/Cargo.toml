[package]
name = "crowkv-console-shared"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
hex = "0.4"
tokio = { workspace = true, features = ["rt", "macros", "time", "process", "io-util"] }
futures = "0.3"
tracing = { workspace = true }
dirs = "5"
russh = "0.45"
async-trait = "0.1"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net"] }
axum = "0.7"
# KV data-plane gRPC client for `tests/kv_e2e_test.rs` (C6's own gRPC
# `KvClient` wrapper is gone; that test now exercises the real
# `crowkv-client` crate end-to-end instead).
crowkv-client = { path = "../../crowkv-client" }
