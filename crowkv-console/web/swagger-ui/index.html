<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CrowKV — Swagger UI</title>
    <link rel="stylesheet" href="swagger-ui.css">
    <link rel="icon" type="image/png" href="favicon-32x32.png" sizes="32x32">
    <link rel="icon" type="image/png" href="favicon-16x16.png" sizes="16x16">
    <style>html,body { margin:0; padding:0; }</style>
</head>
<body>
<div id="swagger-ui"></div>
<script src="swagger-ui-bundle.js" charset="UTF-8"></script>
<script src="swagger-ui-standalone-preset.js" charset="UTF-8"></script>
<script>
// Resolve the upstream OpenAPI document via the console's proxy.
// The OpenAPI spec is identical across all server instances, so
// no server selection is needed. The proxy uses the first registered
// server from the console's configuration.
function buildOpenApiUrl() {
    return '/api/openapi.json';
}

window.onload = function () {
    window.ui = SwaggerUIBundle({
        url: buildOpenApiUrl(),
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        plugins: [SwaggerUIBundle.plugins.DownloadUrl],
        layout: 'StandaloneLayout'
    });
};
</script>
</body>
</html>
