# Inject rpath for pixi/conda lib dir so test binaries (not just bins)
# can find libspdlog and other crowdb-tree FFI dependencies at runtime.
# build.rs rustc-link-arg only covers bin targets of direct dependents;
# this covers test binaries of all crates.
# Test binaries live in target/<profile>/deps/ (3 levels to repo root),
# bin targets live in target/<profile>/ (2 levels to repo root).
# We add both rpaths so both find .pixi/envs/default/lib.
[target.'cfg(target_os = "macos")']
rustflags = [
    "-C", "link-arg=-Wl,-rpath,@loader_path/../../../.pixi/envs/default/lib",
    "-C", "link-arg=-Wl,-rpath,@loader_path/../../.pixi/envs/default/lib",
]

[target.'cfg(target_os = "linux")']
rustflags = [
    "-C", "link-arg=-Wl,-rpath,$ORIGIN/../../../.pixi/envs/default/lib",
    "-C", "link-arg=-Wl,-rpath,$ORIGIN/../../.pixi/envs/default/lib",
]
