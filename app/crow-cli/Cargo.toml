[package]
name = "crow-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "crow-cli"
path = "src/main.rs"

[dependencies]
crow-console-shared = { path = "../../lib/crow-console-shared" }
crow-kv-client = { path = "../../lib/crow-kv-client" }
crow-common = { path = "../../lib/crow-common/rust" }
clap = { version = "4", features = ["derive", "env"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
rand = "0.8"
tracing = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
thiserror = "1"
# R10 benchmark framework: `bench benchmark` embeds a console-web
# instance in-process to provision the fixture's 3-node cluster (also
# used by the A12 kv_cli integration test to spawn a real crow-web
# in front of crow-kv-server, previously a dev-dependency-only use).
crow-web = { path = "../crow-web" }
axum = "0.7"
dirs = "5"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
