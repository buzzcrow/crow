[package]
name = "crow-diskdb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "CROW diskdb server: distributed disk-block allocator (lightweight, stateless; persists to CROW KV)."
autobenches = false

[[bin]]
name = "crow-diskdb"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
crow-protocol = { path = "../../lib/protocol" }
crow-kv-client = { path = "../../lib/crow-kv-client" }
crow-common = { path = "../../lib/crow-common/rust" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "signal", "net", "sync"] }
tonic = { workspace = true }
prost = { workspace = true }
bytes = "1"
clap = { version = "4", features = ["derive"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dashmap = "6"
crc32fast = "1"
bincode = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
