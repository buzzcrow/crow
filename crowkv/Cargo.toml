[package]
name = "crowkv"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "CrowKV core library: consensus, engine, WAL, I/O, RPC, reconfiguration."

[lints]
workspace = true

[dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time", "net"] }
tokio-stream = "0.1"
tonic = { workspace = true }
prost = { workspace = true }

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time", "test-util"] }
criterion = { version = "0.5", features = ["html_reports"] }
dashmap = "6"
crossbeam-skiplist = "0.1"

[[bench]]
name = "slot_list"
harness = false
