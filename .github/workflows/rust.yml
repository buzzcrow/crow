name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  Test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install Protoc
      uses: arduino/setup-protoc@v3
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Run clippy
      run: cargo clippy -- -D warnings
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

  E2E:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Protoc
      uses: arduino/setup-protoc@v3
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Cache cargo + target (incl. crowkv-server binary)
      uses: Swatinem/rust-cache@v2
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: crowkv-console/web/ui/package-lock.json
    - name: Install UI deps
      run: npm ci
      working-directory: crowkv-console/web/ui
    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium
      working-directory: crowkv-console/web/ui
    - name: Run real-backend E2E suite
      run: make e2e
    - name: Upload Playwright report on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          crowkv-console/web/ui/playwright-report
          crowkv-console/web/ui/test-results
        retention-days: 7
