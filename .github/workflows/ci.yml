name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  Test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
        sudo apt-get clean
        df -h /
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: latest
    - name: Check formatting
      run: pixi run cargo fmt --all -- --check
    - name: Run clippy
      run: pixi run cargo clippy --all-targets -- -D warnings
    - name: Clean env
      run: pixi run clean-env
    - name: Run C++ tests
      run: pixi run test-ct
    - name: Clean env
      run: pixi run clean-env
    - name: Run FFI tests
      run: pixi run test-ffi
    - name: Clean env
      run: pixi run clean-env
    - name: Run core tests
      run: pixi run test-core
    - name: Clean env
      run: pixi run clean-env
    - name: Run CLI tests
      run: pixi run test-cli
    - name: Clean env
      run: pixi run clean-env
    - name: Run mgmt-api tests
      run: pixi run test-mgmt-api

  ServerTests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
        sudo apt-get clean
        df -h /
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: latest
    - name: Clean env
      run: pixi run clean-env
    - name: Run server tests (serial)
      run: pixi run test-server

  UITests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
        sudo apt-get clean
        df -h /
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: latest
    - name: Cache cargo + target (incl. crow-kv-server binary)
      uses: Swatinem/rust-cache@v2
    - name: Install Playwright Chromium
      run: pixi run npx playwright install --with-deps chromium
      working-directory: app/crow-web/ui
    - name: Run real-backend E2E suite
      run: pixi run test-ui
    - name: Upload Playwright report on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          app/crow-web/ui/playwright-report
          app/crow-web/ui/test-results
        retention-days: 7
