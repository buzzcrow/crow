name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

# 6 parallel jobs. See doc/working/plan-test.md § "CI Job Grouping Guide"
# for the assignment rule and how to add new test tasks.
jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
        sudo apt-get clean
        df -h /
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: latest
    - name: Cache cargo + target
      uses: Swatinem/rust-cache@v2
    - name: Check formatting
      run: pixi run cargo fmt --all -- --check
    - name: Run clippy
      run: pixi run cargo clippy --all-targets -- -D warnings

  CppTests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
        sudo apt-get clean
        df -h /
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: latest
    - name: Cache cargo + target
      uses: Swatinem/rust-cache@v2
    - name: Clean env
      run: pixi run clean-env
    - name: Build C++ libs + all Rust test binaries
      run: pixi run build-cpp && pixi run build-tests
    - name: Run C++ tests
      run: pixi run test-tree-ct
    - name: Run common C++ tests
      run: pixi run test-common-ct
    - name: Run RPC C++ tests
      run: pixi run test-rpc-ct
    - name: Run diskio C++ tests
      run: pixi run test-diskio-ct
    - name: Run tree FFI tests
      run: pixi run test-tree-ffi
    - name: Run RPC FFI tests
      run: pixi run test-rpc-ffi

  UnitTests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
        sudo apt-get clean
        df -h /
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: latest
    - name: Cache cargo + target
      uses: Swatinem/rust-cache@v2
    - name: Clean env
      run: pixi run clean-env
    - name: Build all Rust test binaries
      run: pixi run build-tests
    - name: Run common tests
      run: pixi run test-common
    - name: Run protocol tests
      run: pixi run test-protocol
    - name: Run core tests
      run: pixi run test-kv-core
    - name: Run client tests
      run: pixi run test-kv-client
    - name: Run chunkdb-client tests
      run: pixi run test-chunkdb-client

  ServerTests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
        sudo apt-get clean
        df -h /
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: latest
    - name: Cache cargo + target
      uses: Swatinem/rust-cache@v2
    - name: Clean env
      run: pixi run clean-env
    - name: Build all Rust test binaries + crow-kv-server
      run: pixi run build-tests
    - name: Run kv-server tests
      run: pixi run test-kv-server
    - name: Run diskdb tests
      run: pixi run test-diskdb
    - name: Run diskdb-client tests
      run: pixi run test-diskdb-client
    - name: Run chunkdb tests
      run: pixi run test-chunkdb
    - name: Run diskio-client tests
      run: pixi run test-diskio-client

  ConsoleTests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
        sudo apt-get clean
        df -h /
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: latest
    - name: Cache cargo + target
      uses: Swatinem/rust-cache@v2
    - name: Clean env
      run: pixi run clean-env
    - name: Build all Rust test binaries + crow-kv-server
      run: pixi run build-tests
    - name: Build crow-rpc-echo-server (for bench rpc e2e test)
      run: pixi run cmake -S lib/crow-rpc -B lib/crow-rpc/build -DCMAKE_BUILD_TYPE=Release && pixi run cmake --build lib/crow-rpc/build --target crow-rpc-echo-server -j
    - name: Run console-shared tests
      run: pixi run test-console-shared
    - name: Run CLI tests
      run: pixi run test-console-cli
    - name: Run mgmt-api tests
      run: pixi run test-console-server

  UITests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
        sudo apt-get clean
        df -h /
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: latest
    - name: Cache cargo + target
      uses: Swatinem/rust-cache@v2
    - name: Build crow-kv-server + crow-diskdb binaries
      run: pixi run build-tests
    - name: Install Playwright Chromium (skip if system browser present)
      working-directory: app/crow-web/ui
      run: |
        for b in /snap/bin/chromium /usr/bin/chromium /usr/bin/chromium-browser /usr/bin/google-chrome /usr/bin/google-chrome-stable /usr/bin/microsoft-edge; do
          [ -x "$b" ] && { echo "System browser found at $b; skipping download."; exit 0; }
        done
        pixi run npx playwright install --with-deps chromium
    - name: Run real-backend E2E suite
      run: pixi run test-console-ui
    - name: Upload Playwright report on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          app/crow-web/ui/playwright-report
          app/crow-web/ui/test-results
        retention-days: 7
