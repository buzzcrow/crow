name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  Test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: latest
    - name: Check formatting
      run: pixi run cargo fmt --all -- --check
    - name: Run clippy
      run: pixi run cargo clippy --all-targets -- -D warnings
    - name: Run tests
      run: pixi run test

  E2E:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: latest
    - name: Cache cargo + target (incl. crowkv-server binary)
      uses: Swatinem/rust-cache@v2
    - name: Install Playwright Chromium
      run: pixi run npx playwright install --with-deps chromium
      working-directory: crowkv-console/web/ui
    - name: Run real-backend E2E suite
      run: pixi run e2e
    - name: Upload Playwright report on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          crowkv-console/web/ui/playwright-report
          crowkv-console/web/ui/test-results
        retention-days: 7
