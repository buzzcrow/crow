[workspace]
resolver = "2"
members = [
    "lib/crow-common/rust",
    "lib/crow-kv",
    "lib/crow-kv-client",
    "lib/crow-protocol",
    "app/crow-kv-server",
    "app/crow-diskdb",
    "lib/crow-diskdb-client",
    "app/crow-chunkdb",
    "lib/crow-chunkdb-client",
    "lib/crow-console-shared",
    "app/crow-web",
    "app/crow-cli",
    "lib/crow-tree/ffi",
    "lib/crow-rpc/ffi",
]
# : crow-tree/ffi moved from `exclude` into `members` now that
# crow-kv depends on it (CrowTreeEngine) -- building crow-kv already triggers
# the C++ build step via crow-tree-ffi's build.rs regardless of workspace
# membership, so the original "keep the C build out of the main workspace"
# rationale for excluding it no longer holds; membership instead unifies
# Cargo.lock resolution (one tokio version tree) across the workspace.
# crow-tree-ffi does not opt into `[lints] workspace = true`, so its
# FFI-necessitated `unsafe` is unaffected by this workspace's
# `unsafe_code = "deny"`.

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/buzzcrow/crowkv"
keywords = ["distributed", "kv-store", "paxos", "consensus", "database"]
categories = ["database-implementations", "distributed-systems"]

[workspace.dependencies]
tokio = { version = "1.40", default-features = false }
crow-common = { path = "lib/crow-common/rust" }
tonic = "0.12"
prost = { version = "0.13", features = ["derive"] }
flatbuffers = "25.12.19"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2"
flate2 = "1"
pin-project-lite = "0.2"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Coding-style rules. "warn" until existing violations are worked down;
# bump to "deny" per crate as splits land. See /coding workflow.
mod_module_files = "warn"     # foo.rs + foo/, no mod.rs
too_many_lines = "warn"       # default threshold 100 (no clippy.toml)
items_after_statements = "warn" # items after statements
