[workspace]
resolver = "2"
members = [
    "crowkv",
    "crowkv-server",
    "crowkv-console/shared",
    "crowkv-console/web",
    "crowkv-console/cli",
]
# Standalone C++/FFI bridge crate: built + tested on its own (it links the
# crowtree C ABI and needs unsafe), kept out of the main async workspace build.
exclude = ["crowtree/ffi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/buzzcrow/crowkv"

[workspace.dependencies]
tokio = { version = "1.40", default-features = false }
tonic = "0.12"
prost = { version = "0.13", features = ["derive"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
