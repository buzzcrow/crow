[workspace]
resolver = "2"
members = [
    "crowkv",
    "crowkv-client",
    "crowkv-server",
    "crowkv-console/shared",
    "crowkv-console/web",
    "crowkv-console/cli",
    "crowtree/ffi",
]
# : crowtree/ffi moved from `exclude` into `members` now that
# crowkv depends on it (CrowtreeEngine) -- building crowkv already triggers
# the C++ build step via crowtree-ffi's build.rs regardless of workspace
# membership, so the original "keep the C build out of the main workspace"
# rationale for excluding it no longer holds; membership instead unifies
# Cargo.lock resolution (one tokio version tree) across the workspace.
# crowtree-ffi does not opt into `[lints] workspace = true`, so its
# FFI-necessitated `unsafe` is unaffected by this workspace's
# `unsafe_code = "deny"`.

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/buzzcrow/crowkv"
keywords = ["distributed", "kv-store", "paxos", "consensus", "database"]
categories = ["database-implementations", "distributed-systems"]

[workspace.dependencies]
tokio = { version = "1.40", default-features = false }
tonic = "0.12"
prost = { version = "0.13", features = ["derive"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2"
flate2 = "1"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
