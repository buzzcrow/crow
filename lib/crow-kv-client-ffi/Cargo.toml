[package]
name = "crow-kv-client-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "C ABI wrapper around HardwareClient and ServiceRegistryClient for C++ consumers (crow-diskio)."

[lib]
name = "crow_kv_client_ffi"
crate-type = ["cdylib", "rlib"]

[features]
# Enables test-only seams on crow-kv (for tests only).
test-util = ["crow-kv-client/test-util"]

[lints]
workspace = true

[dependencies]
crow-kv-client = { path = "../crow-kv-client" }
crow-protocol = { path = "../crow-protocol" }
crow-common = { path = "../crow-common/rust" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
