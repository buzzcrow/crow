[package]
name = "crowdb-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Common flatbuffer schemas and wire types for CROWDB components (diskdb, chunkdb, diskio, kv)."
autobenches = false

[features]
# Derives `utoipa::ToSchema` on mgmt wire types so the kv-server's OpenAPI
# spec can reference them. Off by default — non-server consumers don't
# pull in utoipa.
schema = ["utoipa"]

[lints]
workspace = true

[dependencies]
flatbuffers = { workspace = true }
bytes = "1"
serde = { version = "1", features = ["derive"] }
bincode = "1"
crc32fast = "1"
getrandom = "0.2"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
utoipa = { version = "5", optional = true }
fs2 = "0.4"
thiserror = { workspace = true }

[build-dependencies]
