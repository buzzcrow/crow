// diskdb type definitions: enums, value types for data-group storage,
// and the allocation handle (Segment). Key types are Rust key concepts
// (see doc/design/protocol/design-crow-protocol-key.md), not proto messages.
// DiskId is in common_type.proto.
//
// See doc/design/diskdb/design-crow-diskdb.md.

syntax = "proto3";

package crow.diskdb.rpc;

import "common_type.proto";

// ── Enums ───────────────────────────────────────────────────────

// Physical disk technology. Determines zone implementation.
enum DiskType {
  BLOCK_HDD = 0;
  BLOCK_SSD = 1;
  ZONE_SSD  = 2;
  SMR_HDD   = 3;
}

// Zone allocation lifecycle (in-memory CAS within one diskdb instance).
enum ZoneAllocationState {
  ZONE_ALLOC_ACTIVE    = 0;  // zone is available for allocation
  ZONE_ALLOC_AVAILABLE = 1;  // zone has been used but still has space
  ZONE_ALLOC_FULL      = 2;  // no space left
}

// Per-block I/O-behavior state. Default `BLOCK_STATE_OK` on allocate;
// updated by background paths (sync, health probe, scanner) or by
// re-putting the `BusyBlockValue` with a new `state` — no dedicated
// admin RPC. Not updated by the allocate hot path.
enum BlockState {
  BLOCK_STATE_OK      = 0;  // normal; default on allocate
  BLOCK_STATE_SUSPECT = 1;  // data may be unreadable; data-IO retries with timeout
  BLOCK_STATE_CORRUPT = 2;  // data confirmed unreadable; data-IO skips, rebuilds from EC/mirror
}

// ── Zone value ──────────────────────────────────────────────────

// Zone value — stored at the zone binary key (ZoneKey).
// Snapshot fields only: the usage bitmap + the slot at which this
// snapshot was written + a CRC over the bitmap for integrity. Zone
// metadata (offset, size) and derived fields (alloc_state, used_units)
// live in the in-memory `Zone` struct, not the snapshot. See
// doc/design/diskdb/design-crow-diskdb.md §7.
message ZoneValue {
  reserved 1, 2, 3, 4;  // dropped: disk_offset_units, zone_size_units, alloc_state, used_units
  bytes  usage_bitmap   = 5;  // serialized bitmap
  uint64 snapshot_slot  = 6;  // slot at which this snapshot was written; replay after this
  uint32 crc32          = 7;  // CRC32 over usage_bitmap for integrity
}

// ── Disk value ──────────────────────────────────────────────────

// Disk value — physical disk properties.
// All sizes are in units; unit_size_bytes defines the unit itself.
// Disk key is a Rust key concept (DiskKey, TextKey encoding
// `/hw/disk/<rack_id>/<node_id>/<dg_id>/<disk_id_hex>` in group 0);
// see doc/design/protocol/design-crow-protocol-key.md.
message DiskValue {
  DiskType disk_type       = 1;
  uint64   capacity_units  = 2;
  uint64   zone_size_units = 3;
  uint32   unit_size_bytes = 4;
  uint32   zone_count      = 5;
  crow.common.HwStatus status = 6;
}

// ── DiskGroup value ─────────────────────────────────────────────

// DiskGroup value — logical container of disks on one node.
// DiskGroup key is a Rust key concept (DiskGroupKey, TextKey encoding
// `/hw/dg/<rack_id>/<node_id>/<dg_id>` in group 0); see
// doc/design/protocol/design-crow-protocol-key.md.
message DiskGroupValue {
  crow.common.HwStatus status = 1;
  repeated crow.common.DiskId disk_ids    = 2;
}

// ── Segment (allocation handle) ─────────────────────────────────

// Handle returned to callers on allocation.
// Contains all information needed to locate and free the block.
// No node_id/disk_group_id — disk_id is globally unique.
message Segment {
  crow.common.DiskId  disk_id     = 1;
  uint32  zone_index  = 2;
  uint64  unit_offset = 3;  // offset within zone in units
  uint32  unit_count  = 4;  // how many units
  crow.common.ChunkId owner_chunk = 5;  // chunk that owns this allocation
}

// ── BusyBlock value ─────────────────────────────────────────────

// BusyBlock value — stored at the busy-block binary key (BusyBlockKey).
// Written on allocate; deleted on free.
message BusyBlockValue {
  uint32 unit_count       = 1;  // how many units this allocation spans
  crow.common.ChunkId owner_chunk = 2;  // chunk that owns this allocation
  uint32 unit_size        = 3;  // size of one unit in bytes (carried per-block for the data-IO layer)
  BlockState state        = 4;  // per-block I/O-behavior state; default OK on allocate
}

// ── FreeBlock value ─────────────────────────────────────────────

// FreeBlock value — stored at the free-block binary key (FreeBlockKey).
// Written on free (the corresponding busy-block entry is deleted).
message FreeBlockValue {
  uint32 unit_count        = 1;  // how many units
  crow.common.ChunkId previous_owner = 2;  // who owned it before free
  reserved 3;  // dropped: free_count (no refcount, no version)
}

// ── Query response types ────────────────────────────────────────

// Disk info for query responses — key fields + value fields flattened.
// Replaces the former DiskEntry { DiskKey key; DiskValue value }.
message DiskInfo {
  // Key fields (from DiskKey text-path key).
  uint64             rack_id       = 1;
  uint64             node_id       = 2;
  uint64             disk_group_id = 3;
  crow.common.DiskId disk_id       = 4;
  // Value fields (from DiskValue).
  DiskType           disk_type       = 5;
  uint64             capacity_units  = 6;
  uint64             zone_size_units = 7;
  uint32             unit_size_bytes = 8;
  uint32             zone_count      = 9;
  crow.common.HwStatus status        = 10;
}

// Disk-group info for query responses — key + value fields flattened
// plus member disks.
message DiskGroupInfo {
  // Key fields (from DiskGroupKey text-path key).
  uint64             rack_id       = 1;
  uint64             node_id       = 2;
  uint64             disk_group_id = 3;
  // Value fields (from DiskGroupValue).
  crow.common.HwStatus status      = 4;
  repeated crow.common.DiskId disk_ids         = 5;
  // Member disks.
  repeated DiskInfo   disks        = 6;
}
