// chunkdb gRPC service — served by a future chunkdb server component.
//
// chunkdb is a distributed chunk manager on CROW KV. It allocates
// chunks (logical blocks with mirror or EC protection), backed by
// diskdb Segments. This service definition reserves the protocol
// surface; implementation is a follow-up.

syntax = "proto3";

package crow.chunkdb.rpc;

import "chunkdb_op.proto";

// Served by a future chunkdb server component.
service ChunkdbService {
  rpc AllocateChunk(AllocateChunkRequest)     returns (AllocateChunkResponse);
  rpc AppendChunk(AppendChunkRequest)         returns (AppendChunkResponse);
  rpc QueryChunk(QueryChunkRequest)           returns (QueryChunkResponse);
  rpc SealChunk(SealChunkRequest)             returns (SealChunkResponse);
  rpc DeleteChunk(DeleteChunkRequest)         returns (DeleteChunkResponse);
  rpc DeleteChunkRange(DeleteChunkRangeRequest) returns (DeleteChunkRangeResponse);
  rpc UpdateChunkStrip(UpdateChunkStripRequest) returns (UpdateChunkStripResponse);
  rpc ListChunks(ListChunksRequest)           returns (ListChunksResponse);
}
