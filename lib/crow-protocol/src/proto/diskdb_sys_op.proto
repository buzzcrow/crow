// diskdb admin operation request/response messages.
// Targets group 0; served by a future admin/console component,
// NOT the diskdb server.
//
// Errors are returned via gRPC status codes with `ErrorInfo` details
// (see error_code.proto). Successful responses carry only data fields.

syntax = "proto3";

package crow.diskdb.rpc;

import "common_type.proto";
import "diskdb_type.proto";

// ── Rack admin ──────────────────────────────────────────────────

message AddRackRequest {
  uint64             dc_id   = 1;
  uint64             rack_id = 2;
  crow.common.HwStatus status = 3;
}

message RemoveRackRequest {
  uint64 dc_id                  = 1;
  uint64 rack_id                = 2;
  bool   remove_sub_nodes_disks = 3;
}

// ── Node admin ──────────────────────────────────────────────────

message AddNodeRequest {
  uint64             node_id  = 1;
  uint64             dc_id    = 2;
  uint64             rack_id  = 3;
  crow.common.HwStatus status = 4;
}

message RemoveNodeRequest {
  uint64 node_id           = 1;
  bool   remove_sub_disks  = 2;
}

// ── Disk-group admin ────────────────────────────────────────────

message AddDiskGroupRequest {
  uint64 node_id = 1;
  // dg_id auto-assigned by incrementing node's last_used_dg_id.
}

message AddDiskGroupResponse {
  uint32 disk_group_id = 1;  // assigned dg_id
}

// ── Disk admin ──────────────────────────────────────────────────

message AddDiskRequest {
  uint32   disk_group_id  = 1;  // which disk-group this disk joins
  crow.common.DiskId   disk_id        = 2;
  DiskType disk_type      = 3;
  uint64   capacity_units = 4;
  uint64   zone_size_units = 5;
  uint32   unit_size_bytes = 6;
}

message RemoveDiskRequest {
  crow.common.DiskId disk_id = 1;
}

// ── Status management ───────────────────────────────────────────

message SetDiskStatusRequest {
  crow.common.DiskId disk_id           = 1;
  crow.common.HwStatus status = 2;
}

message SetDiskGroupStatusRequest {
  uint32 disk_group_id     = 1;
  crow.common.HwStatus status = 2;
}

message SetNodeStatusRequest {
  uint64 node_id           = 1;
  crow.common.HwStatus status = 2;
}

message SetRackStatusRequest {
  uint64 dc_id             = 1;
  uint64 rack_id           = 2;
  crow.common.HwStatus status = 3;
}

// ── Empty response (success only, errors via gRPC status) ───────

message AdminResponse {
}

// ── Topology fetch ──────────────────────────────────────────────

// Fetch the full hardware topology from group 0.
// epoch-based: client sends its last-seen epoch; server returns the
// full snapshot if the epoch is stale (or 0), otherwise an empty
// response with the current epoch (no change).
message FetchHardwareRequest {
  uint64 epoch = 1;  // last seen epoch; 0 = full fetch
}

message FetchHardwareResponse {
  uint64                       epoch  = 1;
  repeated crow.common.RackInfo racks  = 2;
  repeated crow.common.NodeInfo nodes  = 3;
  repeated DiskInfo            disks  = 4;
}

// ── Keepalive ───────────────────────────────────────────────────

// Periodic keepalive sent by each diskdb server instance to group 0.
// Updates the instance's heartbeat and owned disk-groups.
message KeepaliveRequest {
  uint64 instance_id        = 1;
  string grpc_endpoint      = 2;
  repeated uint32 owned_dg_ids = 3;
}

message KeepaliveResponse {
}
