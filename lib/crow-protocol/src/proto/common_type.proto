// Common types shared across CROW components.

syntax = "proto3";

package crow.common;

// Hardware status shared by Rack, Node, DiskGroup, and Disk.
// Ordered by severity; INIT is the default (0).
// Effective status of a disk = max(node, group, disk).
enum HwStatus {
  HW_STATUS_INIT        = 0;  // just added, not yet probed
  HW_STATUS_UP          = 1;  // healthy and operational
  HW_STATUS_MAINTENANCE = 2;  // operator-set, taken out of rotation
  HW_STATUS_SUSPECT     = 3;  // transient issues, being watched
  HW_STATUS_MISSING     = 4;  // cannot be found / probed
  HW_STATUS_BAD         = 5;  // confirmed bad
  HW_STATUS_OFFLINE     = 6;  // operator-set, fully removed
}

// 128-bit disk identifier, split into two uint64 for proto efficiency.
// Globally unique — used for KV key routing (reverse-lookup to data group).
message DiskId {
  uint64 high = 1;
  uint64 low  = 2;
}

// 192-bit chunk identifier (owner of allocated blocks).
// A chunk is a logical block composed of multiple busy-blocks from
// different nodes/disks, with EC or mirror protection.
message ChunkId {
  uint64 high = 1;
  uint64 mid  = 2;
  uint64 low  = 3;
}

// ── Rack value ──────────────────────────────────────────────────

// Rack value — physical rack container.
// Rack key is a Rust key concept (RackKey, TextKey encoding
// `/hw/rack/<rack_id>` in group 0); see
// doc/design/protocol/design-crow-key.md.
message RackValue {
  HwStatus status = 1;
  repeated uint64 node_ids = 2;
}

// ── Node value ──────────────────────────────────────────────────

// Node value — physical node metadata.
// disk_group_ids is the list of disk-groups on this node.
// Node key is a Rust key concept (NodeKey, TextKey encoding
// `/hw/node/<rack_id>/<node_id>` in group 0); see
// doc/design/protocol/design-crow-key.md.
message NodeValue {
  HwStatus status               = 1;
  uint64   last_used_dg_id      = 2;
  repeated uint64 disk_group_ids = 3;
  uint64   status_changed_at_ms = 4;
  optional uint64 temp_failure_since_ms = 5;
}

// ── Info types (key + value flattened, for RPC responses) ───────

// Rack info for query responses — key fields + value fields flattened.
// Replaces the former RackEntry { RackKey key; RackValue value }.
message RackInfo {
  // Key field (from RackKey text-path key).
  uint64   rack_id = 1;
  // Value fields (from RackValue).
  HwStatus status  = 2;
  repeated uint64 node_ids = 3;
}

// Node info for query responses — key fields + value fields flattened.
// Replaces the former NodeEntry { NodeKey key; NodeValue value }.
message NodeInfo {
  // Key fields (from NodeKey text-path key).
  uint64   rack_id = 1;
  uint64   node_id = 2;
  // Value fields (from NodeValue).
  HwStatus status               = 3;
  uint64   last_used_dg_id      = 4;
  repeated uint64 disk_group_ids = 5;
  uint64   status_changed_at_ms = 6;
  optional uint64 temp_failure_since_ms = 7;
}
