// diskdb operation request/response messages.
//
// Errors are returned via gRPC status codes with `ErrorInfo` details
// (see error_code.proto). Successful responses carry only data fields.

syntax = "proto3";

package crow.diskdb.rpc;

import "common_type.proto";
import "diskdb_type.proto";

// ── Allocate ────────────────────────────────────────────────────

message AllocateBlocksRequest {
  uint32 disk_group_id            = 1;  // globally unique
  uint32 unit_count               = 2;  // units per allocation
  uint32 count                    = 3;  // how many allocations
  repeated crow.common.DiskId exclude_disk_ids = 4;  // negative disk hints
  crow.common.ChunkId owner_chunk = 5;  // chunk that owns these allocations
}

message AllocateResponse {
  repeated Segment segments = 1;
}

// ── Free ────────────────────────────────────────────────────────

message FreeBlocksRequest {
  repeated Segment segments = 1;
}

message FreeResponse {
  uint32 freed_count = 1;  // how many succeeded
}

// ── Query capacity stats ────────────────────────────────────────

message QueryCapacityStatsRequest {
  // If disk_group_id set = specific group; 0 = all owned.
  uint32 disk_group_id = 1;
}

message QueryCapacityStatsResponse {
  repeated DiskGroupInfo disk_groups = 1;
}

// ── Get info (read-only, from diskdb synced cache) ──────────────

message GetDiskGroupInfoRequest {
  uint32 disk_group_id = 1;
}

message GetDiskGroupInfoResponse {
  DiskGroupInfo group = 1;
}

message GetDiskInfoRequest {
  uint64             node_id       = 1;
  uint32             disk_group_id = 2;
  crow.common.DiskId disk_id       = 3;
}

message GetDiskInfoResponse {
  DiskInfo disk = 1;
}
