// diskdb operation request/response messages.
//
// Errors are returned via gRPC status codes with `ErrorInfo` details
// (see error_code.proto). Successful responses carry only data fields.

syntax = "proto3";

package crow.diskdb.rpc;

import "common_type.proto";
import "diskdb_type.proto";

// ── Allocate ────────────────────────────────────────────────────

message AllocateBlocksRequest {
  uint64 disk_group_id            = 1;  // globally unique
  uint32 unit_count               = 2;  // units per allocation
  uint32 count                    = 3;  // how many allocations
  repeated crow.common.DiskId exclude_disk_ids = 4;  // negative disk hints
  crow.common.ChunkId owner_chunk = 5;  // chunk that owns these allocations
}

message AllocateResponse {
  repeated Segment segments = 1;
}

// ── Free ────────────────────────────────────────────────────────

message FreeBlocksRequest {
  repeated Segment segments = 1;
}

message FreeResponse {
  uint32 freed_count = 1;  // how many succeeded
}

// ── Commit (two-phase allocate → persist) ───────────────────────

// Marks previously-allocated blocks as committed (permanent). Called
// by chunkdb after the chunk record is persisted to the KV group.
// Tentative blocks not committed within a timeout are reclaimable by
// the orphan scanner.
message CommitBlocksRequest {
  repeated Segment segments = 1;
}

message CommitBlocksResponse {
  uint32 committed_count = 1;  // how many succeeded
}

// ── Query capacity stats ────────────────────────────────────────

message QueryCapacityStatsRequest {
  // If disk_group_id set = specific group; 0 = all owned.
  uint64 disk_group_id = 1;
  // R74 drill-down: set for disk-level or zone-level query (0 = not set
  // → disk-group level). The owning diskdb instance is selected by
  // disk_group_id.
  optional crow.common.DiskId disk_id = 2;
  // R74 drill-down: set with disk_id for zone-level query (absent =
  // disk-level). proto3 `optional` so zone 0 is distinguishable from
  // "not set".
  optional uint32 zone_index = 3;
}

message QueryCapacityStatsResponse {
  repeated DiskGroupInfo disk_groups = 1;
}

// ── Get info (read-only, from diskdb synced cache) ──────────────

message GetDiskGroupInfoRequest {
  uint64 disk_group_id = 1;
}

message GetDiskGroupInfoResponse {
  DiskGroupInfo group = 1;
}

message GetDiskInfoRequest {
  uint64             rack_id       = 1;
  uint64             node_id       = 2;
  uint64             disk_group_id = 3;
  crow.common.DiskId disk_id       = 4;
}

message GetDiskInfoResponse {
  DiskInfo disk = 1;
}

// ── Rebuild zone bitmap (strategy 1 full scan) ─────────────────

// On-demand full-scan rebuild of one zone's usage bitmap from the
// live BusyBlockKey records on the data group. `zone_index = u32::MAX`
// means all zones on the disk. Triggers
// `RecoveryEngine::rebuild_zone_bitmap_full_scan`. Used by operators
// for consistency checks and by the §12 scanner as its rebuild
// mechanism.
message RebuildZoneBitmapRequest {
  crow.common.DiskId disk_id    = 1;
  uint32             zone_index = 2;  // u32::MAX = all zones on the disk
}

message RebuildZoneBitmapResponse {
  uint32 rebuilt_zone_count = 1;
  uint64 total_busy_units   = 2;
  uint64 total_free_units   = 3;
}

// ── Recalc disk usage (drift verification, R74 §5) ───────────────

// Replays the journal into a separate bitmap per zone and compares
// against the live in-memory bitmap. v1 reports drift only — does not
// auto-correct (operator runs RebuildZoneBitmap to correct).
message RecalcDiskUsageRequest {
  // 0 = recalc all owned disk-groups; set = recalc one.
  optional uint64 disk_group_id = 1;
}

message RecalcDiskUsageResponse {
  repeated DiskGroupRecalcResult results = 1;
}

message DiskGroupRecalcResult {
  uint64 disk_group_id = 1;
  bool   drift_detected = 2;
  repeated ZoneRecalcResult zones = 3;
}

message ZoneRecalcResult {
  crow.common.DiskId disk_id           = 1;
  uint32             zone_index        = 2;
  bool               matches           = 3;
  bool               drift_detected    = 4;
  uint32             live_busy_blocks  = 5;
  uint32             replayed_busy_blocks = 6;
  uint64             live_snapshot_slot   = 7;
  uint64             replayed_snapshot_slot = 8;
  // Why strategy 2 fell back to strategy 1 (absent if strategy 2
  // succeeded).
  optional string    fallback_reason   = 9;
}

// ── Compact zone (on-demand compaction trigger) ─────────────────

// Triggers compaction on one or more zones of a disk. Compaction
// merges free records into the ZoneValue snapshot (clearing freed
// bits) and deletes the free records in one atomic batch_write. Used
// by operators for manual compaction and by tests to verify the
// persist-only free → compaction → reclaim cycle. Empty zone_indices
// = all zones on the disk.
message CompactZoneRequest {
  crow.common.DiskId disk_id    = 1;
  repeated uint32    zone_indices = 2;  // empty = all zones on the disk
}

message CompactZoneResponse {
  uint32 compacted_zone_count    = 1;
  uint32 total_free_records_deleted = 2;
  repeated ZoneCompactionResult zones = 3;
}

message ZoneCompactionResult {
  uint32          zone_index           = 1;
  bool            success              = 2;
  uint32          free_records_deleted = 3;
  optional string error                = 4;  // absent on success
}

// ── Scanner admin (R75) ─────────────────────────────────────────

// Triggers an immediate scan of all owned zones. The scan runs on the
// next scanner tick (the scanner task's trigger is TimerFn, so
// TriggerScan sets a "scan requested" flag checked at the start of
// the next run_cycle). Returns the last completed scan summary (or an
// empty summary if no scan has run yet) + whether a scan is currently
// in progress.
message TriggerScanRequest {
  // empty — runs all enabled scans
}

message TriggerScanResponse {
  ScanSummary summary          = 1;
  bool        scan_in_progress = 2;  // true if a scan was already running
}

// Returns the last completed scan summary. `has_run` is false if no
// scan has completed yet (the summary is empty in that case).
message GetScanStatusRequest {
  // empty
}

message GetScanStatusResponse {
  ScanSummary summary = 1;  // empty if no scan has run
  bool        has_run = 2;
}

// Summary of one scanner cycle. Reported by TriggerScan and
// GetScanStatus, and recorded as metrics after each cycle.
message ScanSummary {
  uint64 started_at_ms            = 1;
  uint64 duration_ms              = 2;
  uint64 zones_scanned            = 3;
  uint64 zones_skipped_active     = 4;
  uint64 zones_skipped_compacting = 5;
  uint64 ghost_busy               = 6;  // real ghost-busy (drift)
  uint64 ghost_free               = 7;  // ghost-free (drift, defense-in-depth)
  uint64 uncompacted_lag          = 8;  // normal uncompacted (not drift)
  uint64 corrupt_snapshots        = 9;
  uint64 corrupt_records          = 10;
  uint64 owner_mismatches         = 11;
  string leak_status              = 12;  // "deferred" in v1
}
