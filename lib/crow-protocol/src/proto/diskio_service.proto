// diskio gRPC service — served by a future diskio server component.
//
// diskio performs data I/O on disk blocks allocated by diskdb. This
// service definition reserves the protocol surface; implementation is
// a follow-up.

syntax = "proto3";

package crow.diskio.rpc;

import "diskio_op.proto";

// Served by a future diskio server component.
service DiskioService {
  rpc DiskWrite(DiskWriteRequest) returns (DiskWriteResponse);
  rpc DiskRead(DiskReadRequest)   returns (DiskReadResponse);
}
