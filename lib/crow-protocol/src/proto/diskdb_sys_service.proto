// diskdb admin gRPC service — targets group 0; served by a future
// admin/console component, NOT the diskdb server.

syntax = "proto3";

package crow.diskdb.rpc;

import "diskdb_sys_op.proto";

// Targets group 0; served by a future admin/console component.
service DiskdbAdminService {
  // ── Rack ──────────────────────────────────────────────────────
  rpc AddRack(AddRackRequest)                     returns (AdminResponse);
  rpc RemoveRack(RemoveRackRequest)               returns (AdminResponse);
  rpc SetRackStatus(SetRackStatusRequest)         returns (AdminResponse);

  // ── Node ──────────────────────────────────────────────────────
  rpc AddNode(AddNodeRequest)                     returns (AdminResponse);
  rpc RemoveNode(RemoveNodeRequest)               returns (AdminResponse);
  rpc SetNodeStatus(SetNodeStatusRequest)         returns (AdminResponse);

  // ── Disk-group ────────────────────────────────────────────────
  rpc AddDiskGroup(AddDiskGroupRequest)           returns (AddDiskGroupResponse);

  // ── Disk ──────────────────────────────────────────────────────
  rpc AddDisk(AddDiskRequest)                     returns (AdminResponse);
  rpc RemoveDisk(RemoveDiskRequest)               returns (AdminResponse);
  rpc SetDiskStatus(SetDiskStatusRequest)         returns (AdminResponse);
  rpc SetDiskGroupStatus(SetDiskGroupStatusRequest) returns (AdminResponse);

  // ── Topology ──────────────────────────────────────────────────
  rpc FetchHardware(FetchHardwareRequest)         returns (FetchHardwareResponse);

  // ── Keepalive ─────────────────────────────────────────────────
  rpc Keepalive(KeepaliveRequest)                 returns (KeepaliveResponse);
}
