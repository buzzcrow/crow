[package]
name = "crow-test-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared test harness for CROW E2E tests: cluster lifecycle, hardware seeding, service-specific helpers."
autobenches = false

[lints]
workspace = true

[features]
default = []
# KvCluster client helpers (make_hardware_client, make_service_registry_client).
kv-client = ["dep:crow-kv-client"]
# Hardware seeding (seed_hardware). Implies kv-client.
hardware = ["kv-client", "dep:crow-protocol"]
# Diskio test harness (DiskioProcess, test_io_round, etc.). Implies hardware.
diskio = ["hardware", "dep:crow-diskio-client", "dep:crow-rpc-ffi"]
# Diskdb test harness (DiskdbProcess, etc.). Implies hardware.
diskdb = ["hardware", "dep:crow-diskdb-client"]

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1"
tempfile = "3"
tokio = { workspace = true, features = ["rt", "macros", "time", "sync"] }

# Optional, feature-gated
crow-kv-client = { path = "../crow-kv-client", optional = true }
crow-protocol = { path = "../crow-protocol", optional = true }
crow-diskio-client = { path = "../crow-diskio-client", optional = true }
crow-rpc-ffi = { path = "../crow-rpc/ffi", optional = true }
crow-diskdb-client = { path = "../crow-diskdb-client", optional = true }
