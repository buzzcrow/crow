[package]
name = "crow-kv-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Standalone client library for CrowKV: topology cache, retry/idempotency, read-mode routing."

[lints]
workspace = true

[dependencies]
# `crow-kv` gives us the generated tonic KV proto types (`crow_kv::rpc::*`) and
# the `/topology` response shape (`crow_kv::cluster::status::*`, already
# `Serialize`/`Deserialize`) without depending on `crow-kv-server` or
# `crow-console` (see doc/.
crow-kv = { path = "../crow-kv" }
crow-common = { path = "../crow-common/rust" }
bytes = "1"
tokio = { workspace = true, features = ["rt", "macros", "time", "sync"] }
tonic = { workspace = true }
dashmap = "6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util", "net"] }
axum = "0.7"
