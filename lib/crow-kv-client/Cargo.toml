[package]
name = "crow-kv-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Standalone client library for CROW: topology cache, retry/idempotency, read-mode routing."

[lib]
# rlib for Rust dependents; cdylib for C++ consumers (crow-diskio FFI).
# The cdylib only exports C ABI symbols when built with `--features ffi`.
crate-type = ["rlib", "cdylib"]

[features]
# Enables test-only seams on `crow-kv` (e.g. `PxKvStore::set_get_delay_for_tests`)
# for this crate's own test build. Auto-enabled via the self dev-dependency below;
# no `--features` flag needed for `cargo test -p crow-kv-client`.
test-util = ["crow-kv/test-util"]
# Enables the C ABI FFI module (ffi.rs) for C++ consumers like crow-diskio.
# Adds tokio rt-multi-thread for the FFI's dedicated runtime.
ffi = ["tokio/rt-multi-thread"]

[lints]
workspace = true

[dependencies]
# `crow-kv` gives us the generated tonic KV proto types (`crow_kv::rpc::*`) and
# the `/topology` response shape (`crow_kv::cluster::status::*`, already
# `Serialize`/`Deserialize`) without depending on `crow-kv-server` or
# `crow-console` (see doc/.
crow-kv = { path = "../crow-kv" }
crow-protocol = { path = "../crow-protocol" }
crow-common = { path = "../crow-common/rust" }
crow-rpc-ffi = { path = "../crow-rpc/ffi" }
bytes = "1"
flatbuffers = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time", "sync"] }
tokio-stream = "0.1"
tonic = { workspace = true }
dashmap = "6"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.13"
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util", "net"] }
axum = "0.7"
# Self dev-dependency: auto-enables the `test-util` feature for this
# crate's own test build (same pattern as `crow-kv`'s self dev-dep).
crow-kv-client = { path = ".", features = ["test-util"] }
