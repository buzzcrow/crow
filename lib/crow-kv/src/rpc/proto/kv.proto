// KV mutation messages for P4.
//
// Separated from pxos.proto so the Paxos wire contract can freeze
// independently while KV ops evolve.

syntax = "proto3";

package crow_kv.rpc;

// Structured error code for KV read/write responses. proto3
// default 0 = NONE keeps the change wire-compatible: old servers that
// don't set the field produce NONE, and the client falls back to the
// `error` string for NONE. New servers set the code alongside the
// existing `error` string so the client can switch on the code without
// fragile string matching.
enum KvErrorCode {
  KV_ERROR_NONE        = 0;
  KV_ERROR_NOT_LEADER  = 1;
  KV_ERROR_UNAVAILABLE = 2;
  KV_ERROR_INTERNAL    = 3;
  // JournalScan asked for slots already GC'd below the WAL trim point.
  // The caller falls back to a full-scan rebuild (diskdb strategy 1).
  KV_ERROR_JOURNAL_SCAN_GC_GAP = 4;
}

message KvSetRequest {
  uint32 version = 1;
  bytes  key     = 2;
  bytes  value   = 3;
  uint64 seq     = 4;  // client sequence for idempotency
  uint64 ttl_ms  = 5;  // 0 = no expiration
  uint64 client_id = 6;
  uint64 request_id = 7;
  uint64 request_create_ms = 8;
  uint64 group_id = 9;
}

// Point-read consistency mode. Applies to both KvGetRequest and (with the
// same numeric values) KvScanRequest.
//   0 LINEARIZABLE — reflect every committed write; served by the leader
//                    behind a lease fast-path or ReadIndex quorum check,
//                    followers transparently forward.
//   1 MIN_SLOT     — client carries `min_slot`; replica serves locally if
//                    its applied frontier >= min_slot, otherwise redirects
//                    to the leader. min_slot = 0 accepts any staleness;
//                    the write watermark gives read-your-writes; the last
//                    known safe_slot gives bounded-stale.
enum ReadMode {
  LINEARIZABLE = 0;
  MIN_SLOT = 1;
}

message KvGetRequest {
  uint32 version = 1;
  bytes  key     = 2;
  uint64 request_id = 3;
  uint64 request_create_ms = 4;
  uint64 group_id = 5;
  ReadMode read_mode = 6;
  // For MIN_SLOT: the minimum applied slot the replica must have reached
  // before serving locally. 0 = accept any staleness. Ignored by
  // LINEARIZABLE.
  uint64 min_slot = 7;
}

message KvDeleteRequest {
  uint32 version = 1;
  bytes  key     = 2;
  uint64 seq     = 3;
  uint64 client_id = 4;
  uint64 request_id = 5;
  uint64 request_create_ms = 6;
  uint64 group_id = 7;
}

message KvBatchItem {
  bytes  key       = 1;
  bytes  value     = 2;
  bool   is_delete = 3;
}

message KvBatchWriteRequest {
  uint32 version      = 1;
  repeated KvBatchItem items = 2;
  uint64 seq          = 3;
  uint64 client_id = 4;
  uint64 request_id = 5;
  uint64 request_create_ms = 6;
  uint64 group_id = 7;
}

// Unified mutation response.
message KvResponse {
  uint32 version  = 1;
  bool   ok         = 2;
  uint64 revision   = 3;  // logical version / LSN
  string error      = 4;  // empty if ok
  bool   not_found  = 5;  // true when delete targets a missing key
  string not_leader_hint = 6;  // leader endpoint when this node is not the leader
  uint64 request_id = 7;
  uint64 request_create_ms = 8;
  bytes  value      = 9;  // value for get operations
  // Slot the read was served at (the replica's applied frontier for reads).
  uint64 read_slot = 10;
  // Group safe-slot known to the serving replica (min applied across voting
  // members). Meaningful for BOUNDED_STALE reads.
  uint64 safe_slot = 11;
  // Structured error code. Default 0 = NONE (old server).
  KvErrorCode error_code = 12;
}

// Prefix scan over the learner store. V1: local-replica read like
// `KvGet`, no Paxos round-trip; results may include uncommitted-on-this-
// replica writes lagging behind the leader. The handler iterates the
// `DashMap` keys, filters by `prefix`, sorts, then truncates to
// `limit`. `limit == 0` means "no limit".
message KvScanRequest {
  uint32 version = 1;
  bytes  prefix  = 2;
  uint32 limit   = 3;
  uint64 request_id = 4;
  uint64 request_create_ms = 5;
  uint64 group_id = 6;
  ReadMode read_mode = 7;
  // Exclusive lower bound for pagination. Empty = start from the
  // beginning. Only keys strictly greater than `start_after` (and
  // matching `prefix`) are returned.
  bytes  start_after = 8;
  // For MIN_SLOT: same semantics as KvGetRequest.min_slot.
  uint64 min_slot = 9;
  // Exclusive upper bound. Empty = unbounded. Only keys strictly less
  // than `end_key` (and matching `prefix`) are returned.
  bytes  end_key = 10;
  // Skip value materialization: items carry empty `value` fields. The engine
  // skips overflow-chain assembly and value copy; the byte budget accounts for
  // key bytes only, so a page fits more entries. Default false = today's behavior.
  bool   keys_only = 11;
  // Count matching live keys and ship zero items; the response `count` field
  // carries the count. The store counts via a keys_only engine pass with no
  // byte budget (one pass). Default false.
  bool   count_only = 12;
  // Absolute per-scan deadline in unix-ms (0 = no deadline, preserves today's
  // behavior). The engine merge loop checks periodically and breaks early
  // with truncated = true when exceeded; the client pagination loop checks
  // before each page and stops with timed_out = true.
  uint64 deadline_ms = 13;
}

message KvScanItem {
  bytes key   = 1;
  bytes value = 2;
}

message KvScanResponse {
  uint32 version  = 1;
  bool   ok       = 2;
  string error    = 3;
  // If `truncated` is true the caller hit `limit` and should re-scan
  // with a longer `prefix` or higher `limit` to see the rest.
  bool   truncated = 4;
  repeated KvScanItem items = 5;
  uint64 request_id = 6;
  uint64 request_create_ms = 7;
  // Slot the scan was served at (the serving replica's applied frontier).
  uint64 read_slot = 8;
  // Leader endpoint when this node is not the leader (MinSlot scan on a
  // lagging follower). Empty for other failure shapes.
  string not_leader_hint = 9;
  // Structured error code. Default 0 = NONE (old server).
  KvErrorCode error_code = 10;
  // Matched-key count for `count_only` scans (zero items shipped). 0 otherwise.
  uint64 count = 11;
  // Deadline fired mid-scan: the result is partial (truncated = true, entries
  // fetched before the deadline). Default false.
  bool   timed_out = 12;
}

service KvService {
  rpc Put(KvSetRequest) returns (KvResponse);
  rpc Get(KvGetRequest) returns (KvResponse);
  rpc Delete(KvDeleteRequest) returns (KvResponse);
  rpc BatchWrite(KvBatchWriteRequest) returns (KvResponse);
  rpc Scan(KvScanRequest) returns (KvScanResponse);
  rpc JournalScan(KvJournalScanRequest) returns (KvJournalScanResponse);
  rpc CreateSnapshot(CreateSnapshotRequest) returns (CreateSnapshotResponse);
  rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse);
  rpc SnapshotScan(SnapshotScanRequest) returns (SnapshotScanResponse);
  rpc ReleaseSnapshot(ReleaseSnapshotRequest) returns (ReleaseSnapshotResponse);
}

// Snapshot versioning API (R59): pin a point-in-time-consistent L1 view
// for backup/analytics. CreateSnapshot flushes L0 -> L1 and pins the
// durable view at last_applied_slot; SnapshotScan iterates the frozen
// vector with prefix/pagination; ReleaseSnapshot drops the pin.
message CreateSnapshotRequest {
  uint64 group_id = 1;
  ReadMode read_mode = 2;
  uint64 min_slot = 3;
}

message CreateSnapshotResponse {
  bool   ok = 1;
  string error = 2;
  uint64 snapshot_handle = 3;
  uint64 at_slot = 4;
  KvErrorCode error_code = 5;
  string not_leader_hint = 6;
}

message ListSnapshotsRequest {
  uint64 group_id = 1;
}

message SnapshotInfo {
  uint64 snapshot_handle = 1;
  uint64 at_slot = 2;
  uint64 lease_remaining_ms = 3;
}

message ListSnapshotsResponse {
  bool   ok = 1;
  string error = 2;
  repeated SnapshotInfo snapshots = 3;
}

message SnapshotScanRequest {
  uint64 snapshot_handle = 1;
  bytes  prefix = 2;
  bytes  start_after = 3;
  uint32 limit = 4;
  uint64 group_id = 5;
}

message SnapshotScanResponse {
  bool   ok = 1;
  string error = 2;
  bool   truncated = 3;
  repeated KvScanItem items = 4;
  KvErrorCode error_code = 5;
}

message ReleaseSnapshotRequest {
  uint64 snapshot_handle = 1;
  uint64 group_id = 2;
}

message ReleaseSnapshotResponse {
  bool   ok = 1;
  string error = 2;
}

// Slot-ordered scan over the chosen log. Returns individual KV ops
// (Put / Delete) in commit (slot) order within [min_slot, max_slot],
// filtered by key prefix. Used by diskdb strategy 2 (journal scan
// replay) — the existing `Scan` RPC returns key order, not slot order,
// so it cannot drive a correct replay. Pagination via `limit` +
// `last_op_slot`: the caller sends `min_slot = last_op_slot + 1` for
// the next page.
message KvJournalScanRequest {
  uint32 version    = 1;
  uint64 group_id   = 2;
  uint64 min_slot   = 3;  // inclusive lower bound
  uint64 max_slot   = 4;  // inclusive upper bound; 0 = MAX (current applied)
  bytes  key_prefix = 5;  // only ops whose key starts with this prefix
  uint32 limit      = 6;  // max ops per response page; 0 = unlimited
  uint64 request_id = 7;
  uint64 request_create_ms = 8;
  ReadMode read_mode = 9;  // LINEARIZABLE or MIN_SLOT (min_slot doubles
                           // as the read-freshness floor for MIN_SLOT)
}

message KvJournalOp {
  bytes  key    = 1;
  bytes  value  = 2;  // empty for Delete
  bool   is_delete = 3;
  uint64 slot   = 4;  // the slot at which this op was committed
}

message KvJournalScanResponse {
  uint32 version  = 1;
  bool   ok       = 2;
  string error    = 3;
  repeated KvJournalOp ops = 4;
  bool   truncated = 5;  // hit `limit`; more ops remain
  uint64 last_op_slot = 6;  // slot of the last op returned (for pagination)
  uint64 read_slot = 7;  // the applied frontier when the scan ran
  KvErrorCode error_code = 8;
  string not_leader_hint = 9;
  uint64 request_id = 10;
  uint64 request_create_ms = 11;
}
