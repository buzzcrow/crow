[package]
name = "crowdb-tree-ffi"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Safe Rust adapter over the crowdb-tree C ABI (PT8)."
publish = false

[lib]
name = "crowdb_tree_ffi"
path = "src/lib.rs"

[features]
default = []
# Auto-init C++ spdlog to a temp dir on first Crowdbtree::open. Used by
# this crate's own tests (via self dev-dependency) so tree engine logs go
# to files instead of stderr without each test calling ct_init_test_logging.
test-util = []

[dependencies]
bytes = "1"
# "net" is required for tokio::io::unix::AsyncFd, "sync" for tokio::sync::
# Notify.
tokio = { version = "1.40", features = ["rt", "rt-multi-thread", "macros", "net", "sync"] }

[build-dependencies]
cc = "1"

[dev-dependencies]
crowdb-test-harness = { path = "../../crowdb-test-harness" }
# Self dev-dependency: turns on `test-util` so integration tests auto-init
# C++ logging to a temp dir on first Crowdbtree::open.
crowdb-tree-ffi = { path = ".", features = ["test-util"] }
