[package]
name = "crow-rpc-ffi"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Safe Rust async facade over the crow-rpc C ABI (R104)."
publish = false

[lib]
name = "crow_rpc_ffi"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.40", features = ["rt", "rt-multi-thread", "macros", "sync"] }

[dev-dependencies]
crow-protocol = { path = "../../crow-protocol" }
flatbuffers = { workspace = true }

[build-dependencies]
cc = "1"
