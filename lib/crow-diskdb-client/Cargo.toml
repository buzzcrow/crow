[package]
name = "crow-diskdb-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Client library for CROW diskdb: allocate/free/query disk blocks."
autobenches = false

[lints]
workspace = true

[dependencies]
crow-protocol = { path = "../crow-protocol" }
crow-kv-client = { path = "../crow-kv-client" }
crow-rpc-ffi = { path = "../crow-rpc/ffi" }
tokio = { workspace = true, features = ["rt", "macros", "time", "sync"] }
tonic = { workspace = true }
bytes = "1"
flatbuffers = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
dashmap = "6"

[dev-dependencies]
crow-kv-client = { path = "../crow-kv-client" }
crow-test-harness = { path = "../crow-test-harness", features = ["diskdb"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1"
tempfile = "3"
